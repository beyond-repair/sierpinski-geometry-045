[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sierpinski-geometry-045"
version = "0.1.0"
description = "Claim-0 0.45-scaled asymmetric Sierpinski tetrahedron generator and gasket graph audits. Not thrust."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All Rights Reserved" }
authors = [{ name = "Brian Ware" }]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sierpinski-geometry-045 = "gasket_catalog:main"

[tool.setuptools]
py-modules = [
  "sierpinski_generator",
  "gasket_flux_audit",
  "conductance_shear",
  "gasket_graph",
  "gasket_catalog",
  "report",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
pythonpath = ["."]
